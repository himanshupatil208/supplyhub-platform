
server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supplyhub?currentSchema=inventory}
    username: ${SPRING_DATASOURCE_USERNAME:supplyhub}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
